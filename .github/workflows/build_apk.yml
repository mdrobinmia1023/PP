name: Build Chorcha Reader Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew if present
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename & Prepare APK
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-artifacts/ChorchaReader-debug.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChorchaReader-Debug-APK
          path: build-artifacts/ChorchaReader-debug.apk
          retention-days: 14
